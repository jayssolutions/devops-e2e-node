name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Select action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - "apply"
          - "destroy"

env:
  AWS_REGION: us-east-1

jobs:
  ci:
    name: "Continuous Integration"
    runs-on: ubuntu-latest
    # Skip CI unit testing step when triggering a manual destroy
    if: github.event.inputs.action != 'destroy'

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

  deploy:
    name: "Infrastructure & Deployment"
    runs-on: ubuntu-latest
    needs: ci
    if: always() && (needs.ci.result == 'success' || github.event.inputs.action == 'destroy') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Setup Python & Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          if [ -f ansible/requirements.yml ]; then
            ansible-galaxy collection install -r ansible/requirements.yml
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect Runner Public IP
        id: runner_ip
        run: echo "cidr=$(curl -fsS https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      # --- MANUAL DESTROY BRANCH ---
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: terraform
        env:
          TF_VAR_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ steps.runner_ip.outputs.cidr }}
        run: |
          terraform init -input=false -reconfigure
          terraform destroy -input=false -auto-approve

      # --- APPLY AND DEPLOY BRANCH ---
      - name: Terraform Init, Validate and Apply
        if: github.event.inputs.action != 'destroy'
        working-directory: terraform
        env:
          TF_VAR_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ steps.runner_ip.outputs.cidr }}
        run: |
          terraform init -input=false -reconfigure
          terraform fmt -check -recursive
          terraform validate
          terraform apply -input=false -auto-approve
          terraform output -raw application_url > ../application_url.txt

      - name: Build Deployment Archive
        if: github.event.inputs.action != 'destroy'
        run: tar --exclude=node_modules -czf app.tar.gz -C app .

      - name: Configure SSH Private Key
        if: github.event.inputs.action != 'destroy'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Build Ansible Inventory
        if: github.event.inputs.action != 'destroy'
        run: |
          chmod +x scripts/build_inventory.sh
          ./scripts/build_inventory.sh

      - name: Wait for SSH Availability
        if: github.event.inputs.action != 'destroy'
        run: |
          TARGET_IP=$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' ansible/ansible_inventory.ini | head -n 1)
          echo "Checking SSH connectivity on $TARGET_IP..."
          until nc -z -v -w5 $TARGET_IP 22; do
            echo "Waiting for SSH port 22 on $TARGET_IP..."
            sleep 5
          done
          echo "SSH daemon is active!"

      - name: Deploy with Ansible
        if: github.event.inputs.action != 'destroy'
        env:
          APP_ARCHIVE: "../app.tar.gz"
          ANSIBLE_HOST_KEY_CHECKING: "False"
        working-directory: ansible
        run: |
          ansible-playbook -i ansible_inventory.ini playbook.yml --private-key ~/.ssh/id_ed25519

      - name: Smoke Test
        if: github.event.inputs.action != 'destroy'
        run: |
          APP_URL=$(cat application_url.txt)
          echo "Testing endpoint $APP_URL/health..."
          for i in {1..12}; do
            if curl -fsS "$APP_URL/health"; then
              echo "Smoke test passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed."
          exit 1

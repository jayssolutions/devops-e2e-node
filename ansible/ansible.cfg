[defaults]
host_key_checking = False
inventory = inventory.ini
interpreter_python = auto_silent

[defaults]
# Automatically use the Terraform-generated inventory
inventory = ./ansible/inventory.ini

# Amazon Linux 2023 default admin user
remote_user = ec2-user

# Automatically use the Terraform-generated private key
private_key_file = ./id_ed25519

# Disable host key checking for short-lived CI/CD and newly provisioned EC2 runners
host_key_checking = False

# Increase timeout for cloud instance provisioning delays
timeout = 30

# Enable colored output and readable callback formatting
stdout_callback = yaml

[ssh_connection]
# Optimize SSH connection speed and automatically handle host key bypass
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null